<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cidades Inteligentes - Cadastro</title>
  <!-- Ícones Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    /* 1. RESET & BOX MODEL */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* CONTAINER PRINCIPAL */
    .container {
      background-color: #1e293b;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 500px;
      overflow: hidden;
    }

    /* GRADIENTE NO HEADER */
    .header {
      background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
      padding: 30px 20px;
      text-align: center;
    }

    .header h1 {
      font-size: 1.5rem;
      margin-bottom: 8px;
    }

    .header p {
      font-size: 0.9rem;
      opacity: 0.9;
    }

    /* FLEXBOX NO FORMULÁRIO */
    form {
      display: flex;
      flex-direction: column;
      gap: 18px;
      padding: 30px 24px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 0.85rem;
      color: #94a3b8;
      font-weight: 600;
    }

    /* POSICIONAMENTO DE ÍCONES (POSITION RELATIVE / ABSOLUTE) */
    .input-container {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-container i {
      position: absolute;
      left: 14px;
      color: #64748b;
      font-size: 1.1rem;
      transition: color 0.3s ease;
    }

    /* INPUTS & FEEDBACK VISUAL (:FOCUS / :HOVER) */
    input {
      width: 100%;
      padding: 12px 14px 12px 42px;
      background-color: #0f172a;
      border: 2px solid #334155;
      border-radius: 8px;
      color: #ffffff;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.3s ease;
    }

    input:hover {
      border-color: #475569;
    }

    input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 8px rgba(59, 130, 246, 0.4);
    }

    input:focus + i,
    .input-container:focus-within i {
      color: #3b82f6;
    }

    /* BOTÃO DE ENVIAR */
    button {
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      color: #ffffff;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
    }

    /* MEDIA QUERIES (RESPONSIVIDADE) */
    @media (min-width: 600px) {
      .container {
        max-width: 650px;
      }

      .form-row {
        display: flex;
        gap: 16px;
      }

      .form-row .form-group {
        flex: 1;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Cabeçalho Atualizado -->
    <div class="header">
      <h1><i class="fa-solid fa-city"></i> Cidade Inteligente</h1>
      <p>Conecte-se à infraestrutura da cidade inteligente</p>
    </div>

    <!-- Formulário Flexbox -->
    <form>
      <!-- Nome Completo -->
      <div class="form-group">
        <label for="nome">Nome Completo</label>
        <div class="input-container">
          <input type="text" id="nome" placeholder="Digite seu nome" required>
          <i class="fa-solid fa-user"></i>
        </div>
      </div>

      <!-- E-mail e Telefone -->
      <div class="form-row">
        <div class="form-group">
          <label for="email">E-mail</label>
          <div class="input-container">
            <input type="email" id="email" placeholder="seu@email.com" required>
            <i class="fa-solid fa-envelope"></i>
          </div>
        </div>

        <div class="form-group">
          <label for="telefone">Telefone</label>
          <div class="input-container">
            <input type="tel" id="telefone" placeholder="(00) 00000-0000" required>
            <i class="fa-solid fa-phone"></i>
          </div>
        </div>
      </div>

      <!-- Senhas -->
      <div class="form-row">
        <div class="form-group">
          <label for="senha">Senha</label>
          <div class="input-container">
            <input type="password" id="senha" placeholder="••••••••" required>
            <i class="fa-solid fa-lock"></i>
          </div>
        </div>

        <div class="form-group">
          <label for="confirmar-senha">Confirmar Senha</label>
          <div class="input-container">
            <input type="password" id="confirmar-senha" placeholder="••••••••" required>
            <i class="fa-solid fa-shield-halved"></i>
          </div>
        </div>
      </div>

      <button type="submit">Cadastrar no Sistema</button>
    </form>
  </div>

</body>
</html>
